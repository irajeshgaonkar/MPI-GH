info:
  name: Invalid Data Type
  type: http
  seq: 1

http:
  method: POST
  url: "{{URL}}{{Enrich}}"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: "{\r

      \    \r

      \    \"trackingId\": \"{{trackingId}}\",\r

      \    \"content\": {\r

      \        \"responseIdentityFormatNames\": [\"{{RIFN}}\"],\r

      \        \"identity\": {\r

      \            \"addresses\": [\r

      \                {\r

      \                    \"line1\": \"{{AddressLine1}}\",\r

      \                    \"line2\": \"{{AddressLine2}}\",\r

      \                    \"city\": \"{{City}}\",\r

      \                    \"state\": \"{{State}}\",\r

      \                    \"postalCode\": \"{{ZipCode}}\"\r

      \                }\r

      \            ],\r

      \            \"names\": [\r

      \                {\r

      \                    \"first\": {{FirstName}},\r

      \                    \"last\": \"{{LastName}}\"\r

      \                }\r

      \            ],\r

      \            \"ssns\": [\"{{SSN}}\"],\r

      \            \"genders\": [\r

      \                \"{{Gender}}\"\r

      \            ],\r

      \            \"datesOfBirth\": [\r

      \                \"{{DateOfBirth}}\"\r

      \            ],\r

      \            \"phoneNumbers\": [\r

      \                {\r

      \                    \"number\": \"{{Number}}\",\r

      \                    \"areaCode\": \"{{AreaCode}}\",\r

      \                    \"extension\": \"{{Extension}}\",\r

      \                    \"countryCode\": \"{{CountryCode}}\"\r

      \                }\r

      \            ]\r

      \        }\r

      \    }\r

      }"
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: "let responseIdentityFormatNames = \"DEFAULT\";\r

        bru.setVar('RIFN',responseIdentityFormatNames);\r

        \r

        let line1 = \"422 Farrell Path\"\r

        bru.setVar('AddressLine1', line1);\r

        \r

        let line2 = \"\"\r

        bru.setVar('AddressLine2', line2);\r

        \r

        let city = \"Somerville\"\r

        bru.setVar('City', city);\r

        \r

        let state = \"MA\"\r

        bru.setVar('State', state);\r

        \r

        let postalcode = \"02143\"\r

        bru.setVar('ZipCode', postalcode);\r

        \r

        let firstname = \"Greg\"\r

        bru.setVar('FirstName', firstname);\r

        \r

        let lastname = \"Harris\"\r

        bru.setVar('LastName', lastname);\r

        \r

        let ssn = \"\"\r

        bru.setVar('SSN', ssn);\r

        \r

        let dob = \"1989-05-25\"\r

        bru.setVar('DateOfBirth', dob);\r

        \r

        let gender = \"M\"\r

        bru.setVar('Gender', gender);\r

        \r

        let number = \"\"\r

        bru.setVar('Number', number);\r

        \r

        let areacode = \"\"\r

        bru.setVar('AreaCode', areacode);\r

        \r

        let extension = \"\"\r

        bru.setVar('Extension', extension);\r

        \r

        let countrycode = \"\"\r

        bru.setVar('CountryCode', countrycode);"
    - type: after-response
      code: |-
        test("Status code is 500", function() {
            expect(res.getStatus()).to.equal(500);
        });

        test("Response time", function () {
          expect(res.getResponseTime()).to.be.below(Number(bru.getGlobalEnvVar("Runtime")));
        });

        // Get the response body as JSON
        let jsonData = res.getBody();

        test("Response body", function () {
            // Check if errorCode exists before testing its value
            expect(jsonData).to.have.property("errorCode");
            expect(jsonData.errorCode).to.eql("500");  // Compare as string since errorCode is a string in the response
            
            // Check that 'success' is false
            expect(jsonData.success).to.eql(false);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
