info:
  name: Min Length of string field
  type: http
  seq: 4

http:
  method: POST
  url: "{{URL}}{{Unlink}}"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: "{ \r

      \  \"trackingId\": \"{{trackingId}}\",\r

      \  \"content\": {\r

      \    \"unlinkFromSource\": {\r

      \      \"name\": \"{{SourceName1}}\",\r

      \      \"id\": \"{{id1}}\"\r

      \    },\r

      \    \"source\": {\r

      \      \"name\": \"{{SourceName2}}\",\r

      \      \"id\": \"{{id2}}\"\r

      \    }\r

      \  }\r

      }\r\n"
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        bru.setVar("SourceName1", "dshs.bams");
        bru.setVar("SourceName2", "dshs.bams");
        bru.setEnvVar("trackingId","testing post for .NetUpgrade")

        // Function to generate a random string of a specified length
        function generateRandomString(length) {
            const characters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
            let result = '';
            for (let i = 0; i < length; i++) {
                result += characters.charAt(Math.floor(Math.random() * characters.length));
            }
            return result;
        }

        // Generate a random string of exactly 3 characters
        const id1 = generateRandomString(3);
        const id2 = generateRandomString(3);

        // Assign the random string to SourceId
        bru.setVar('id1', id1);
        bru.setVar('id2', id2);
    - type: after-response
      code: |-
        // Parse the response body
        var jsonData = res.getBody();

        // Validate that the response status code is 200 OK
        test("Response status is 200 OK", function () {
            expect(res.getStatus()).to.equal(200); // Adjust the status code based on actual API response
        });

        test("Response time", function () {
          expect(res.getResponseTime()).to.be.below(Number(bru.getGlobalEnvVar("Runtime")));
        });

        // Validate that the `success` field is false
        test("Validate 'success' is false", function () {
            expect(jsonData.success).to.eql(false);
        });


        // Validate the `message` field contains the expected text
        test("Validate 'message' field", function () {
            expect(jsonData.message).to.include("One or more source:nativeId combinations not in Link DB");
        });

        // Validate the `errors` array and its content
        test("Validate 'errors' array", function () {
            expect(jsonData.errors).to.be.an("array").that.is.not.empty;
            expect(jsonData.errors[0]).to.include("One or more source:nativeId combinations not in Link DB");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
