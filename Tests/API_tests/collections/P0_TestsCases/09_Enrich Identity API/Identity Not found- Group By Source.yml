info:
  name: Identity Not found- Group By Source
  type: http
  seq: 4

http:
  method: POST
  url: "{{URL}}{{Enrich}}"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
          
          "trackingId": "{{trackingId}}",
          "content": {
              "responseIdentityFormatNames": ["{{RIFN}}"],
              "identity": {
                  "addresses": [
                      {
                          "line1": "{{AddressLine1}}",
                          "line2": "{{AddressLine2}}",
                          "city": "{{City}}",
                          "state": "{{State}}",
                          "postalCode": "{{ZipCode}}"
                      }
                  ],
                  "names": [
                      {
                          "first": "{{FirstName}}",
                          "last": "{{LastName}}"
                      }
                  ],
                  "ssns": ["{{SSN}}"],
                  "genders": [
                      "{{Gender}}"
                  ],
                  "datesOfBirth": [
                      "{{DateOfBirth}}"
                  ],
                  "phoneNumbers": [
                      {
                          "number": "{{Number}}",
                          "areaCode": "{{AreaCode}}",
                          "extension": "{{Extension}}",
                          "countryCode": "{{CountryCode}}"
                      }
                  ]
              }
          }
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        let responseIdentityFormatNames = "GROUP_BY_SOURCE";
        bru.setVar('RIFN',responseIdentityFormatNames);

        let line1 = "12 MAIN ST"
        bru.setVar('AddressLine1', line1);

        let line2 = "3"
        bru.setVar('AddressLine2', line2);

        let city = "SEATTLE"
        bru.setVar('City', city);

        let state = "WA"
        bru.setVar('State', state);

        let postalcode = "28907843345"
        bru.setVar('ZipCode', postalcode);

        let firstname = "JIM"
        bru.setVar('FirstName', firstname);

        let lastname = "JIN"
        bru.setVar('LastName', lastname);

        let ssn = ""
        bru.setVar('SSN', ssn);

        let dob = "2002-05-03"
        bru.setVar('DateOfBirth', dob);

        let gender = "M"
        bru.setVar('Gender', gender);

        let number = "123-555-457"
        bru.setVar('Number', number);

        let areacode = ""
        bru.setVar('AreaCode', areacode);

        let extension = ""
        bru.setVar('Extension', extension);

        let countrycode = ""
        bru.setVar('CountryCode', countrycode);
    - type: after-response
      code: |-
        // Validate status code
        test("Status code is 200", function () {
            expect(res.getStatus()).to.eql(200); // Replace 200 with your expected status code
        });

        // Validate runtime is within 200 ms
        test("Response time is within acceptable range", function () {
            expect(res.getResponseTime()).to.be.below(Number(bru.getGlobalEnvVar("Runtime")));
        });

        // Validate response body
        test("Response body is valid", function () {
            const jsonData = res.getBody();

            // Validate success field
            expect(jsonData.success).to.be.true;
            expect(jsonData.retryableError).to.be.false;
            expect(jsonData.errors).to.be.null;


            // Validate the message
            expect(jsonData.message).to.eql("No identity found.");

            
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
