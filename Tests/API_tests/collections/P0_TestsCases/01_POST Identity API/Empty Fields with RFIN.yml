info:
  name: Empty Fields with RFIN
  type: http
  seq: 6

http:
  method: POST
  url: "{{URL}}{{Post}}"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |2-
       
      {
          "trackingId":"{{trackingId}}",
          "protectedPopulation": [
              {
                  "ProtectedPopulationFlag": "{{ProtectedPopulationFlag}}"
              }
          ],
          "content": {
              "responseIdentityFormatNames":["{{RIFN}}"],

              "identity": {
                  "custom.CreateDates": [
                      {
                          "createDate": "{{createDate}}"
                      }
                  ],
                  "sources": [
                      {
                          "name": "{{SourceName}}",
                          "id": "{{sourceId}}"
                      }
                  ],
                  "emails": ["{{Email}}"],
                  "addresses": [
                      {
                          "line1": "{{AddressLine1}}",
                          "line2": "{{AddressLine2}}",
                          "city": "{{City}}",
                          "state": "{{State}}",
                          "postalCode": "{{ZipCode}}"
                      }
                  ],
                  "names": [
                      {
                          "first": "{{FirstName}}",
                          "middle": "{{MiddleName}}",
                          "last": "{{LastName}}",
                          "suffix": "{{Suffix}}"
                      }
                  ],
                  "ssns": ["{{SSN}}"],
                  "genders": [
                      "{{Gender}}"
                  ],
                  "datesOfBirth": [
                      "{{DateOfBirth}}"
                  ],
                  "phoneNumbers": [
                      {
                          "number": "{{Number}}",
                          "areaCode": "{{AreaCode}}",
                          "extension": "{{Extension}}",
                          "countryCode": "{{CountryCode}}"
                      }
                  ]
              }
          }
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        var sourceId = bru.interpolate('{{$randomUUID}}');
        bru.setVar('sourceId', sourceId);

        let responseIdentityFormatNames = "DEFAULT";
        bru.setVar('RIFN',responseIdentityFormatNames);

        let email = ""
        bru.setVar('Email', email);

        let line1 = ""
        bru.setVar('AddressLine1', line1);

        let line2 = ""
        bru.setVar('AddressLine2', line2);

        let city = ""
        bru.setVar('City', city);

        let state = ""
        bru.setVar('State', state);

        let postalcode = ""
        bru.setVar('ZipCode', postalcode);

        let firstname = ""
        bru.setVar('FirstName', firstname);

        let lastname = ""
        bru.setVar('LastName', lastname);

        let middlename = ""
        bru.setVar('MiddleName', middlename);

        let suffix = ""
        bru.setVar('Suffix', suffix);

        let ssn = ""
        bru.setVar('SSN', ssn);

        let dob = ""
        bru.setVar('DateOfBirth', dob);

        let gender = ""
        bru.setVar('Gender', gender);

        let number = ""
        bru.setVar('Number', number);

        let areacode = ""
        bru.setVar('AreaCode', areacode);

        let extension = ""
        bru.setVar('Extension', extension);

        let countrycode = ""
        bru.setVar('CountryCode', countrycode);
    - type: after-response
      code: |-
        test("Status code is 200", function() {
            expect(res.getStatus()).to.equal(200);
        });


        test("Response time", function () {
          expect(res.getResponseTime()).to.be.below(Number(bru.getGlobalEnvVar("Runtime")));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
