info:
  name: Invalid Data Types
  type: http
  seq: 9

http:
  method: POST
  url: "{{URL}}{{Post}}"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |2-
       
      {
          "trackingId":"{{trackingId}}",
          "protectedPopulation": [
              {
                  "ProtectedPopulationFlag": "{{ProtectedPopulationFlag}}"
              }
          ],
          "content": {
              "responseIdentityFormatNames":["{{RIFN}}"],

              "identity": {
                  "custom.CreateDates": [
                      {
                          "createDate": "{{createDate}}"
                      }
                  ],
                  "sources": [
                      {
                          "name": "{{SourceName}}",
                          "id": "{{sourceId}}"
                      }
                  ],
                  "emails": [{{Email}}],
                  "addresses": [
                      {
                          "line1": "{{AddressLine1}}",
                          "line2": "{{AddressLine2}}",
                          "city": "{{City}}",
                          "state": "{{State}}",
                          "postalCode": "{{ZipCode}}"
                      }
                  ],
                  "names": [
                      {
                          "first": "{{FirstName}}",
                          "middle": "{{MiddleName}}",
                          "last": "{{LastName}}",
                          "suffix": "{{Suffix}}"
                      }
                  ],
                  "ssns": [{{SSN}}],
                  "genders": [
                      "{{Gender}}"
                  ],
                  "datesOfBirth": [
                      "{{DateOfBirth}}"
                  ],
                  "phoneNumbers": [
                      {
                          "number": "{{Number}}",
                          "areaCode": "{{AreaCode}}",
                          "extension": "{{Extension}}",
                          "countryCode": "{{CountryCode}}"
                      }
                  ]
              }
          }
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        var sourceId = bru.interpolate('{{$randomUUID}}');
        bru.setVar('sourceId', sourceId);

        let responseIdentityFormatNames = "DEFAULT";
        bru.setVar('RIFN', responseIdentityFormatNames);

        // Setting email as boolean true
        let emailBoolean = true;
        bru.setVar('Email', emailBoolean);

        //using predefined varables generating random email
        //var email = bru.interpolate('{{$randomEmail}}');
        //bru.setVar('Email',email);

        // Function to generate an SSN without hyphens and as a numeric value
        function generateIntSSN() {
            // First part as integer (equivalent to 000)
            const firstPart = 000; // JS doesn't support leading zeros in numbers
            
            // Generate the second and third parts as integers
            const secondPart = Math.floor(10 + Math.random() * 90);   // Random 2 digits (10-99)
            const thirdPart = Math.floor(1000 + Math.random() * 9000); // Random 4 digits (1000-9999)
            
            // Combine parts as an integer (without hyphens)
            const ssn = parseInt(`${firstPart}${secondPart}${thirdPart}`);
            
            return ssn;
        }

        // Generate the SSN and set it in Postman variables
        const uniqueSSN = generateIntSSN();
        bru.setVar('SSN', uniqueSSN);


        // Using predefined variables for names
        let firstName = bru.interpolate('{{$randomFirstName}}');
        let lastName = bru.interpolate('{{$randomLastName}}');
        let suffix = bru.interpolate('{{$randomNameSuffix}}');
        let middleName = bru.interpolate('{{$randomFirstName}}');

        bru.setVar('FirstName', firstName);
        bru.setVar('MiddleName', middleName);
        bru.setVar('LastName', lastName);
        bru.setVar('Suffix', suffix);

        // Function to generate a random gender with fewer than 10 characters
        function generateRandomGender() {
            const genders = ['Male', 'Female', 'Nonbinary', 'Other'];
            const randomGender = genders[Math.floor(Math.random() * genders.length)];
            return randomGender;
        }

        // Generate a random gender
        const gender = generateRandomGender();
        bru.setVar('Gender', gender);

        // Function to generate a random date of birth within the past 130 years
        function generateRandomDOB() {
            const currentDate = new Date();
            const minYear = currentDate.getFullYear() - 130; // 130 years ago
            const randomYear = Math.floor(Math.random() * (currentDate.getFullYear() - minYear + 1)) + minYear;
            const randomMonth = Math.floor(Math.random() * 12);
            const randomDay = Math.floor(Math.random() * 28) + 1;

            const randomDate = new Date(randomYear, randomMonth, randomDay);
            const formattedDate = ('0' + (randomDate.getMonth() + 1)).slice(-2) + '/' + 
                                  ('0' + randomDate.getDate()).slice(-2) + '/' + 
                                  randomDate.getFullYear();

            return formattedDate;
        }

        // Generate a random Date of Birth
        const randomDOB = generateRandomDOB();
        bru.setVar('DateOfBirth', randomDOB);

        // Setting address variables
        let line1 = bru.interpolate('{{$randomStreetAddress}}');
        let line2 = bru.interpolate('{{$randomStreetName}}');
        let city = bru.interpolate('{{$randomCity}}');

        bru.setVar('AddressLine1', line1);
        bru.setVar('AddressLine2', line2);
        bru.setVar('City', city);

        const stateArray = ["NY", "CA", "IL", "TX", "AZ", "PA", "TX", "OH", "IN", "FL", "GA", "MI", "NC", "WA", "NJ"];

        // Function to get a random element from an array
        function getRandomElement(array) {
            return array[Math.floor(Math.random() * array.length)];
        }

        // Generate a random address
        const address = {
            state: getRandomElement(stateArray),
            zipCode: Math.floor(10000 + Math.random() * 90000).toString()
        };

        bru.setVar('State', address.state);
        bru.setVar('ZipCode', address.zipCode);

        // Function to generate a random number with a given length
        function generateRandomNumber(length) {
            let result = '';
            for (let i = 0; i < length; i++) {
                result += Math.floor(Math.random() * 10);
            }
            return result;
        }

        // Function to generate a random phone number
        function generateRandomPhoneNumber() {
            return {
                number: `${generateRandomNumber(3)}-${generateRandomNumber(3)}`,
                countryCode: 'USA'
            };
        }

        // Generate a random phone number
        const phoneNumber = generateRandomPhoneNumber();
        bru.setVar('Number', phoneNumber.number);
        bru.setVar('CountryCode', phoneNumber.countryCode);

        // Setting area code and extension variables
        let areaCode = bru.interpolate('{{$randomInt}}');
        let extension = bru.interpolate('{{$randomInt}}');
        bru.setVar('AreaCode', areaCode);
        bru.setVar('Extension', extension);
    - type: after-response
      code: |-
        test("Status code is 500", function() {
            expect(res.getStatus()).to.equal(500);
        });


        test("Response time", function () {
          expect(res.getResponseTime()).to.be.below(Number(bru.getGlobalEnvVar("Runtime")));
        });

        // Get the response body as JSON
        let jsonData = res.getBody();

        //validate linkid is genearted, fewer than 1024 characters, and is a string
        test("Response", function () {
            expect(jsonData.message).to.include("(400)");
            
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
