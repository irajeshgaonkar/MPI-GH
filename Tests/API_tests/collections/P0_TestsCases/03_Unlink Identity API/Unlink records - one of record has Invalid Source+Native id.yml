info:
  name: Unlink records - one of record has Invalid Source+Native id
  type: http
  seq: 4

http:
  method: POST
  url: "{{URL}}{{Unlink}}"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |
      { 
        "trackingId": "{{trackingId}}",
        "content": {
          "unlinkFromSource": {
            "name": "{{SourceName1}}",
            "id": "{{id1}}"
          },
          "source": {
            "name": "{{SourceName2}}",
            "id": "{{id2}}"
          }
        }
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        bru.deleteEnvVar("SourceName2");

        bru.setVar("id2", "asdf26-56yh7789-adftgyh780-6578ui99c678");
        bru.setVar("SourceName2", "wrdghj.wrd");
    - type: after-response
      code: |-
        // Validate that the response status code is 200 OK
        test("Response status is 200 OK", function () {
            expect(res.getStatus()).to.equal(200);
        });

        // Validate that the response time is within 200ms
        test("Response time", function () {
          expect(res.getResponseTime()).to.be.below(Number(bru.getGlobalEnvVar("Runtime")));
        });

        // Parse the response body
        var jsonData = res.getBody();

        // Validate the errorCode field
        test("Error code is 400", function () {
            expect(jsonData.errorCode).to.eql("400");
        });

        // Validate the message field
        test("Message is 'UnlinkFromSource and Source do not match.'", function () {
            expect(jsonData.message).to.eql("UnlinkFromSource and Source do not match.");
        });

        // Validate the success field is false
        test("Success is false", function () {
            expect(jsonData.success).to.be.false;
        });


        // Validate trackingId
        test("Trackingid", function(){
        expect(jsonData.trackingId).to.eql(bru.getVar("trackingId"));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
