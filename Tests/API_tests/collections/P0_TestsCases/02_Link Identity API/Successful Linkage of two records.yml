info:
  name: Successful Linkage of two records
  type: http
  seq: 1

http:
  method: POST
  url: "{{URL}}{{Link}}"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |
      {
        "trackingId": "{{trackingId}}",
        "content": {
          "linkToSource": {
            "name": "{{SourceName1}}",
            "id": "{{id1}}"
          },
          "source": {
            "name": "{{SourceName2}}",
            "id": "{{id2}}"
          }
        }
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        bru.setVar("trackingId", "testing post for .NetUpgrade")
        bru.setVar("id1", "eeab43c9-b118-405c-b393-083fd2ed5755")
        bru.setVar("id2", "346a2b95-cb1c-46c6-abdf-114133b8beec")
        bru.setVar("SourceName1", "dshs.bams")
        bru.setVar("SourceName2", "dshs.bams")
    - type: after-response
      code: |-
        // Validate that the response status code is 200 OK
        test("Response status is 200 OK", function () {
            expect(res.getStatus()).to.equal(200);
        });

        test("Response time", function () {
          expect(res.getResponseTime()).to.be.below(Number(bru.getGlobalEnvVar("Runtime")));
        });


        // Parse the response body
        var jsonData = res.getBody();

        // Set environment variable
        bru.setVar("link_id", "67bf663a6d5f0d47b68c5902");

        // Validate that the environment variable 'link_id' is present and not null or undefined
        test("Check if 'link_id' is present in the environment", function () {
            var linkId = bru.getVar("link_id"); // Get the environment variable
            expect(linkId).to.not.be.null; // Check if it's not null
            expect(linkId).to.not.be.undefined; // Check if it's not undefined
        });
        // console.log("id1:", bru.getEnvVar("id1"));
        // console.log("SourceName1:", bru.getEnvVar("SourceName1"));
        // console.log("id2:", bru.getEnvVar("id2"));
        // console.log("SourceName2:", bru.getEnvVar("SourceName2"));
        // Get the environment variable
        var expectedLinkToSourceId = bru.getVar("id1");

        // Validate that linkToSource.id is equal to the environment variable
        test("Validate linkToSource.id matches the environment variable", function () {
            expect(jsonData.content.linkToSource.id).to.eql(expectedLinkToSourceId);
        });

        // Validate that the errors field is null
        test("Errors field is null", function () {
            expect(jsonData.errors).to.be.null;
        });

        var Url = bru.getGlobalEnvVar("URL");
        var unlink = bru.getGlobalEnvVar("Unlink");

        var requestOptions = {
            url: Url + unlink,
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Accept': 'application/json'
            },
            data: {
                trackingId: bru.getEnvVar("trackingId"),
                content: {
                    unlinkFromSource: {
                        name: bru.getEnvVar("SourceName1"),
                        id: bru.getEnvVar("id1")
                    },
                    source: {
                        name: bru.getEnvVar("SourceName2"),
                        id: bru.getEnvVar("id2")
                    }
                }
            }
        };

        // send request (callback version)
        bru.sendRequest(requestOptions, function(err, res) {
            if (err) {
                console.error(err);
            } else {
                var jsonData = res.getBody();
                console.log("Unlink response:", jsonData);
            }
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
