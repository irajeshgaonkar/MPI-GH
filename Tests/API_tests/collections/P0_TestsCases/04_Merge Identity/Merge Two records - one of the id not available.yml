info:
  name: Merge Two records - one of the id not available
  type: http
  seq: 3

http:
  method: POST
  url: "{{URL}}{{Merge}}"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
          "trackingId": "{{trackingId}}",
          "content": {
              "toSurviveSource": {
                  "name": "{{SourceName1}}",
                  "id": "{{id1}}"
              },
              "toRetireSource": {
                  "name": "{{SourceName2}}",
                  "id": "{{id2}}"
              }
          }
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        bru.deleteEnvVar("id2");

        bru.setVar("id2", "asdf26-56yh7789-adftgyh780-6578ui99c678");
        bru.setVar("trackingId", "testing post for .NetUpgrade");
    - type: after-response
      code: |-
        // Parse the response body
        var jsonData = res.getBody();

        // Validate that the response status code is 200 OK
        test("Response status is 200 OK", function () {
            expect(res.getStatus()).to.equal(200);
        });

        test("Response time", function () {
          expect(res.getResponseTime()).to.be.below(Number(bru.getGlobalEnvVar("Runtime")));
        });

        test("Validate response body fields", function () {

            // Check for empty content
            expect(jsonData.content).to.be.an("object").that.is.empty;

            // Validate trackingId and auditId
            expect(jsonData.trackingId).to.be.a("string").that.is.not.empty;
          
            // Validate trackingId
            expect(jsonData.trackingId).to.eql(bru.getVar("trackingId"));

            // Validate success and retryableError flags
            expect(jsonData.success).to.eql(false);
            expect(jsonData.retryableError).to.eql(false);

            // Validate message and errors
            expect(jsonData.message).to.eql("One or more source:nativeId combinations not in Link DB");
            expect(jsonData.errors[0]).to.eql("One or more source:nativeId combinations not in Link DB");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
