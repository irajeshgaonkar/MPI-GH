<div class="reports-export-modal" *ngIf="dialogOpen" role="dialog" aria-modal="true" aria-labelledby="reports-export-title">
  <div class="reports-export-modal__backdrop" (click)="closeExportDialog()"></div>
  <div class="reports-export-modal__dialog">
    <div class="reports-export-modal__header">
      <div>
        <h2 id="reports-export-title">Export Reports</h2>
        <p>Select sections to include in one PDF. Current page filters are applied.</p>
      </div>
      <button type="button" class="reports-export-modal__close" (click)="closeExportDialog()" [disabled]="exporting" aria-label="Close export dialog">×</button>
    </div>

    <div class="reports-export-modal__body">
      <label class="reports-export-modal__option reports-export-modal__option--all">
        <input
          type="checkbox"
          [checked]="selectAll"
          [disabled]="exporting"
          (change)="toggleSelectAll($any($event.target).checked)" />
        <span>All</span>
      </label>

      <div class="reports-export-modal__divider"></div>

      <label class="reports-export-modal__option" *ngFor="let section of sections">
        <input
          type="checkbox"
          [checked]="isSectionSelected(section.id)"
          [disabled]="exporting"
          (change)="toggleSection(section.id, $any($event.target).checked)" />
        <span>{{ section.label }}</span>
      </label>
    </div>

    <div class="reports-export-modal__footer">
      <span class="reports-export-modal__status" *ngIf="exporting">Generating PDF...</span>
      <button type="button" class="btn btn-outline-secondary" (click)="closeExportDialog()" [disabled]="exporting">Cancel</button>
      <button type="button" class="btn btn-primary" (click)="runExport()" [disabled]="!canExport()">
        {{ exporting ? "Exporting..." : "Export PDF" }}
      </button>
    </div>
  </div>
</div>
