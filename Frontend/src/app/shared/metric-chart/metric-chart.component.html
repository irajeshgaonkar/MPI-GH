<section class="metric-chart-card">
    <div class="metric-chart-card__head">
        <div>
            <h3>{{title}}</h3>
            <p>{{subtitle}}</p>
        </div>
        <div class="metric-chart-card__legend">
            <span class="metric-chart-card__legend-item" *ngFor="let item of series; trackBy: trackBySeries">
                <span class="metric-chart-card__legend-swatch" [style.background]="item.color"></span>
                {{item.label}}
            </span>
        </div>
    </div>

    <div class="metric-chart-card__body" *ngIf="hasData(); else noChartData">
        <div class="metric-chart-card__plot">
            <div
                class="metric-chart-card__tooltip"
                *ngIf="activeIndex !== null"
                [ngStyle]="getTooltipStyle()">
                <strong>{{activeTimestampLabel()}}</strong>
                <span class="metric-chart-card__tooltip-row" *ngFor="let item of series; trackBy: trackBySeries">
                    <i class="metric-chart-card__legend-swatch" [style.background]="item.color"></i>
                    {{item.label}}: {{activeValue(item.key)}}
                </span>
                <ng-container *ngIf="activeSourceBreakdown().length">
                    <span class="metric-chart-card__tooltip-divider">By source</span>
                    <div class="metric-chart-card__tooltip-sources">
                        <span class="metric-chart-card__tooltip-row" *ngFor="let source of activeSourceBreakdown()">
                            {{ source.source }}: {{ formatSourceBreakdown(source) }}
                        </span>
                    </div>
                </ng-container>
            </div>
            <svg
                [attr.viewBox]="'0 0 ' + chartWidth + ' ' + chartHeight"
                class="metric-chart-svg"
                preserveAspectRatio="none"
                (mouseleave)="clearActiveIndex()">
                <line x1="18" y1="24" x2="18" y2="202" class="metric-chart-axis"></line>
                <line x1="18" y1="202" x2="622" y2="202" class="metric-chart-axis"></line>
                <line
                    *ngIf="activeIndex !== null"
                    [attr.x1]="getXPosition(activeIndex)"
                    y1="18"
                    [attr.x2]="getXPosition(activeIndex)"
                    y2="202"
                    class="metric-chart-guide">
                </line>
                <ng-container *ngIf="isBarVariant(); else lineAreaSeries">
                    <ng-container *ngFor="let item of series; trackBy: trackBySeries">
                        <rect
                            *ngFor="let point of data; let index = index"
                            [attr.x]="getBarX(index)"
                            [attr.y]="getBarY(item.key, index)"
                            [attr.width]="getBarWidth()"
                            [attr.height]="getBarHeight(item.key, index)"
                            [attr.fill]="item.color"
                            [attr.fill-opacity]="activeIndex === index ? 1 : 0.82"
                            class="metric-chart-bar"
                            rx="4"
                            ry="4">
                        </rect>
                    </ng-container>
                </ng-container>
                <ng-template #lineAreaSeries>
                    <ng-container *ngFor="let item of series; trackBy: trackBySeries">
                        <polygon
                            *ngIf="variant === 'area'"
                            [attr.points]="getAreaPoints(item.key)"
                            [attr.fill]="item.color"
                            fill-opacity="0.14">
                        </polygon>
                        <polyline
                            [attr.points]="getPoints(item.key)"
                            [attr.stroke]="item.color"
                            stroke-width="3"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            fill="none">
                        </polyline>
                        <circle
                            *ngIf="activeIndex !== null"
                            [attr.cx]="getXPosition(activeIndex)"
                            [attr.cy]="activePointY(item.key)"
                            r="5"
                            [attr.fill]="item.color"
                            class="metric-chart-point">
                        </circle>
                    </ng-container>
                </ng-template>
                <g *ngFor="let point of data; let index = index">
                    <rect
                        [attr.x]="isBarVariant() ? getBarX(index) : getXPosition(index) - 18"
                        y="18"
                        [attr.width]="isBarVariant() ? getBarWidth() : 36"
                        height="184"
                        class="metric-chart-hitbox"
                        (mouseenter)="setActiveIndex(index)"
                        (focus)="setActiveIndex(index)"
                        tabindex="0">
                    </rect>
                </g>
            </svg>
        </div>

        <div class="metric-chart-card__ticks">
            <span>{{getTickLabel(0)}}</span>
            <span>{{getTickLabel(getMidTickIndex())}}</span>
            <span>{{getTickLabel(data.length - 1)}}</span>
        </div>
    </div>

    <ng-template #noChartData>
        <div class="metric-chart-card__empty">No metric data available yet.</div>
    </ng-template>
</section>
